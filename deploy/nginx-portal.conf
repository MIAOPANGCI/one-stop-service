# ============================================================
# Nginx 反代：公网域名 -> frp 隧道 -> 公司内网门户
# 放在公网服务器上，把 portal.your-company.com 换成你的域名
# ============================================================

server {
    listen 80;
    server_name portal.your-company.com;
    # 强制跳 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name portal.your-company.com;

    ssl_certificate     /etc/letsencrypt/live/portal.your-company.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.your-company.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 门户是纯静态页面，关掉不必要的限制
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:18080;   # 对应 frpc.toml 里的 remotePort
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 如果要给门户加一层基础认证（外网访问强烈建议）
    # auth_basic "Corp Portal";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # 也可以只放行公司出口 IP
    # allow 1.2.3.4;
    # deny all;
}
