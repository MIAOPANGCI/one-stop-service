<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色管理 · 企业服务大厅</title>
<script>(function(){var m=null,t=null;try{m=localStorage.getItem('cp-theme');}catch(e){}if(m!=='light'&&m!=='dark'&&m!=='system'){m='system';}t=(m==='light'||m==='dark')?m:((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');var d=document.documentElement;d.setAttribute('data-theme',t);d.setAttribute('data-theme-mode',m);})();</script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="page-body">

<header class="subnav">
  <a class="subnav-back" href="/users.html" title="返回用户管理">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 5l-7 7 7 7"></path>
    </svg>
  </a>
  <h1>角色管理</h1>
  <div class="subnav-right">
    <span class="subnav-user" id="meName"></span>
    <button class="subnav-back theme-btn" id="themeBtn" type="button" title="切换夜间模式">
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"></path>
      </svg>
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 14.6A8.4 8.4 0 0 1 9.4 3.5a8.4 8.4 0 1 0 11.1 11.1z"></path>
      </svg>
    </button>
    <button class="btn-line" id="logoutBtn" type="button">退出登录</button>
  </div>
</header>

<main class="page">
  <div class="page-bar">
    <div class="page-title">
      <h2>角色与可见范围</h2>
      <p id="countText">正在加载…</p>
    </div>
    <div class="page-tools">
      <button class="btn-primary" id="addRoleBtn" type="button">＋ 新增角色</button>
    </div>
  </div>

  <div class="table-wrap">
    <table class="utable">
      <thead>
        <tr>
          <th>角色</th>
          <th>管理权限</th>
          <th>可见服务</th>
          <th>用户数</th>
          <th class="ta-r">操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <p class="page-note">
    可见范围只影响「能打开哪些服务」；管理权限决定能不能改服务、改设置、管用户。管理员角色始终全部可见、全部可管。
  </p>
</main>

<!-- 角色编辑弹窗 -->
<div class="modal" id="roleModal" hidden>
  <div class="modal-mask" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" style="max-width:560px">
    <div class="modal-head">
      <h3 id="modalTitle">新增角色</h3>
      <button class="x" type="button" data-close>✕</button>
    </div>
    <div class="modal-body">
      <label class="field">
        <span>角色名称 <b>*</b></span>
        <input id="r-name" type="text" maxlength="12" placeholder="例如：财务、生产、外部协作">
      </label>

      <div class="field">
        <span>管理权限</span>
        <div class="cap-grid">
          <label class="check-row"><input type="checkbox" id="c-links"><span>管理服务（增删改、排序）</span></label>
          <label class="check-row"><input type="checkbox" id="c-settings"><span>修改大厅设置（外观、壁纸等）</span></label>
          <label class="check-row"><input type="checkbox" id="c-users"><span>管理用户与角色</span></label>
        </div>
      </div>

      <div class="field">
        <span>可见服务</span>
        <div class="radio-row">
          <label class="radio-item"><input type="radio" name="seeAll" value="1"><span>全部可见</span></label>
          <label class="radio-item"><input type="radio" name="seeAll" value="0"><span>只给下面勾选的</span></label>
        </div>
        <div class="vis-box" id="visBox" hidden></div>
        <small class="hint">勾分类等于勾中这个分类下的全部服务；新加的服务要回来勾一次。</small>
      </div>

      <p class="warn-line" id="rWarn" hidden></p>
    </div>
    <div class="modal-foot">
      <div class="spacer"></div>
      <button class="btn-text" type="button" data-close>取消</button>
      <button class="btn-primary" id="saveRoleBtn" type="button">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="assets/ui.js"></script>
<script src="assets/roles.js"></script>
</body>
</html>
