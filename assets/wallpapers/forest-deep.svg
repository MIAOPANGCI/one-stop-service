<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0b1f1c"/>
      <stop offset="0.4" stop-color="#123328"/>
      <stop offset="0.72" stop-color="#1b4a37"/>
      <stop offset="1" stop-color="#0d2620"/>
    </linearGradient>
    <radialGradient id="light" cx="0.68" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#a8e6c0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a8e6c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fog" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfeade" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#cfeade" stop-opacity="0"/>
    </radialGradient>
    <filter id="b8"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#light)"/>

  <!-- 远景树 -->
  <g fill="#123a2e" opacity="0.55" filter="url(#b8)">
    <path d="M180,760 L240,470 L300,760 Z"/><path d="M330,760 L392,520 L454,760 Z"/>
    <path d="M520,760 L590,440 L660,760 Z"/><path d="M700,760 L756,560 L812,760 Z"/>
    <path d="M1180,760 L1246,470 L1312,760 Z"/><path d="M1330,760 L1392,540 L1454,760 Z"/>
    <path d="M1500,760 L1566,450 L1632,760 Z"/><path d="M1690,760 L1748,570 L1806,760 Z"/>
  </g>

  <ellipse cx="960" cy="800" rx="1100" ry="170" fill="url(#fog)"/>

  <!-- 中景树 -->
  <g fill="#0d2b22" opacity="0.85">
    <path d="M60,980 L150,600 L240,980 Z"/><path d="M250,980 L330,660 L410,980 Z"/>
    <path d="M1220,980 L1310,610 L1400,980 Z"/><path d="M1420,980 L1495,670 L1570,980 Z"/>
    <path d="M1600,980 L1690,590 L1780,980 Z"/><path d="M1780,980 L1850,680 L1920,980 Z"/>
  </g>

  <!-- 近景树影 -->
  <g fill="#07160f">
    <path d="M-40,1140 L120,760 L280,1140 Z"/><path d="M220,1140 L330,830 L440,1140 Z"/>
    <path d="M1560,1140 L1690,740 L1820,1140 Z"/><path d="M1760,1140 L1860,850 L1960,1140 Z"/>
    <rect x="0" y="1000" width="1920" height="140"/>
  </g>
</svg>
