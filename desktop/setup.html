<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>连接服务端</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 18px 22px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 13px/1.7 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: #1a2430;
    background: #f5f7fa;
    -webkit-user-select: none;
    user-select: none;
  }

  .card {
    width: 100%;
    max-width: 480px;
    padding: 20px 24px 16px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 24px 56px -34px rgba(16, 24, 40, .45), 0 1px 0 rgba(16, 24, 40, .04);
  }

  .head { display: flex; align-items: center; gap: 13px; margin-bottom: 18px; }

  .logo {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    padding: 3px;
    border-radius: 13px;
    background: #f1f7f6;
    object-fit: contain;
  }

  h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .01em; }
  .sub { margin: 3px 0 0; font-size: 12px; color: #7b8590; }

  .lbl { display: block; font-size: 12.5px; color: #4a5663; margin-bottom: 6px; }

  input[type="text"] {
    width: 100%;
    height: 40px;
    padding: 0 13px;
    border: 1px solid #dfe5ea;
    border-radius: 10px;
    background: #f8fafb;
    color: #1a2430;
    font: inherit;
    font-size: 13.5px;
    outline: none;
    transition: border-color .16s, box-shadow .16s, background .16s;
    -webkit-user-select: text;
    user-select: text;
  }

  input[type="text"]:focus {
    border-color: #2fa795;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(47, 167, 149, .16);
  }

  input::placeholder { color: #b3bac1; }

  .hint { margin: 7px 0 0; font-size: 11.5px; color: #8b95a1; }

  .row { display: flex; align-items: center; gap: 10px; margin-top: 16px; }

  button {
    height: 38px;
    padding: 0 18px;
    border-radius: 9px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: filter .16s, background .16s, color .16s, border-color .16s;
  }

  button:disabled { opacity: .6; cursor: default; }

  .primary {
    border: 0;
    background: #2fa795;
    color: #fff;
    box-shadow: 0 8px 18px -10px rgba(6, 60, 54, .8);
  }
  .primary:hover:not(:disabled) { filter: brightness(1.06); }

  .ghost {
    border: 1px solid #dfe5ea;
    background: #fff;
    color: #41505c;
  }
  .ghost:hover:not(:disabled) { background: #f4f7f9; }

  .msg {
    margin: 13px 0 0;
    padding: 9px 11px;
    border-radius: 9px;
    font-size: 12.5px;
    line-height: 1.6;
    word-break: break-all;
    background: #f2f5f8;
    color: #41505c;
  }
  .msg.ok { background: #eefaf1; color: #15803d; }
  .msg.err { background: #fdeff0; color: #c0393e; }
  .msg.warn { background: #fdf6e7; color: #9a6a10; }

  .foot {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    padding-top: 13px;
    border-top: 1px solid #eef1f4;
    font-size: 11.5px;
    color: #8b95a1;
  }

  .foot code {
    padding: 1px 5px;
    border-radius: 4px;
    background: #f1f4f7;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px;
    color: #4a5663;
  }

  .ver { margin-left: auto; color: #a2abb5; font-variant-numeric: tabular-nums; }

  .link {
    height: auto;
    padding: 0;
    border: 0;
    background: none;
    color: #8b95a1;
    font-size: 11.5px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .link:hover { color: #41505c; }
  .link:disabled { opacity: .55; text-decoration: none; cursor: default; }
</style>
</head>
<body>

<div class="card">
  <div class="head">
    <img class="logo" src="build/icon.png" alt="">
    <div>
      <h1>连接服务端</h1>
      <p class="sub">客户端只是个壳，服务和应用数据都在服务端那一份里。</p>
    </div>
  </div>

  <label class="lbl" for="url">服务端地址</label>
  <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="http://192.168.3.20:8080">

  <p class="hint" id="hint">填服务端那台机器的 IP 和端口，结尾的斜杠可省。</p>

  <div class="row">
    <button id="test" class="ghost" type="button">测试连接</button>
    <button id="go" class="primary" type="button">连接</button>
  </div>

  <p class="msg" id="msg" hidden></p>

  <div class="foot">
    <span>服务端用 <code>start.bat</code> 第 3 项启动</span>
    <span class="ver" id="ver"></span>
    <button id="check" class="link" type="button">检查更新</button>
    <button id="quit" class="link" type="button">退出</button>
  </div>
</div>

<script>
  var q = new URLSearchParams(location.search);
  var input = document.getElementById('url');
  var hint = document.getElementById('hint');
  var msg = document.getElementById('msg');
  var testBtn = document.getElementById('test');
  var goBtn = document.getElementById('go');
  var quitBtn = document.getElementById('quit');

  var suggest = q.get('suggest');
  if (suggest) input.placeholder = suggest;

  var origin = q.get('origin');
  if (origin) input.value = origin;

  function show(text, kind) {
    if (!text) { msg.hidden = true; msg.textContent = ''; return; }
    msg.hidden = false;
    msg.className = 'msg' + (kind ? ' ' + kind : '');
    msg.textContent = text;
  }

  function busy(on) {
    testBtn.disabled = on;
    goBtn.disabled = on;
    goBtn.textContent = on ? '连接中…' : '连接';
  }

  function readUrl() {
    var v = input.value.trim();
    if (!v) { show('先填服务端地址', 'warn'); input.focus(); return ''; }
    if (!/^https?:\/\//i.test(v)) {
      v = 'http://' + v;
      input.value = v;
    }
    return v.replace(/\/+$/, '');
  }

  if (q.get('msg')) show(q.get('msg'), 'warn');

  testBtn.addEventListener('click', function () {
    var url = readUrl();
    if (!url) return;

    busy(true);
    show('正在连接 ' + url + ' …');

    window.desktopAPI.probeServer(url).then(function (r) {
      if (r && r.ok) show('连上了 · 服务端 v' + (r.version || '?'), 'ok');
      else show((r && r.error) || '连不上', 'err');
    }).catch(function (e) {
      show('测试失败：' + (e && e.message ? e.message : e), 'err');
    }).then(function () { busy(false); });
  });

  goBtn.addEventListener('click', function () {
    var url = readUrl();
    if (!url) return;

    busy(true);
    show('正在连接 ' + url + ' …');

    window.desktopAPI.saveServer(url).then(function (r) {
      if (r && r.ok) {
        show('已连接，正在打开大厅…', 'ok');
        return;
      }
      show((r && r.error) || '保存失败', 'err');
      busy(false);
    }).catch(function (e) {
      show('保存失败：' + (e && e.message ? e.message : e), 'err');
      busy(false);
    });
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); goBtn.click(); }
  });

  // 版本号 + 检查更新（走主进程，和菜单「帮助 → 检查更新」同一套逻辑）
  var checkBtn = document.getElementById('check');
  var verEl = document.getElementById('ver');

  if (window.desktopAPI && window.desktopAPI.getServerInfo) {
    window.desktopAPI.getServerInfo().then(function (info) {
      if (info && info.version) verEl.textContent = 'v' + info.version;
    }).catch(function () {});
  }

  checkBtn.addEventListener('click', function () {
    if (!window.desktopAPI || !window.desktopAPI.checkUpdate) {
      show('当前版本不支持检查更新', 'warn');
      return;
    }

    checkBtn.disabled = true;
    checkBtn.textContent = '检查中…';

    window.desktopAPI.checkUpdate().catch(function (e) {
      show('检查更新失败：' + (e && e.message ? e.message : e), 'err');
    }).then(function () {
      checkBtn.disabled = false;
      checkBtn.textContent = '检查更新';
    });
  });

  quitBtn.addEventListener('click', function () {
    if (window.desktopAPI && window.desktopAPI.quitApp) window.desktopAPI.quitApp();
    else window.close();
  });

  input.focus();
  input.select();
</script>

</body>
</html>
