<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#0d3b3a"/>
      <stop offset="0.30" stop-color="#155d54"/>
      <stop offset="0.55" stop-color="#1a7364"/>
      <stop offset="0.78" stop-color="#0f4a48"/>
      <stop offset="1" stop-color="#082b2e"/>
    </linearGradient>

    <radialGradient id="sun" cx="0.26" cy="0.06" r="0.6">
      <stop offset="0" stop-color="#a6fbe0" stop-opacity="0.40"/>
      <stop offset="0.4" stop-color="#66dcc0" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#66dcc0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="fog" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cbeae0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#cbeae0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vig" cx="0.5" cy="0.52" r="0.78">
      <stop offset="0.45" stop-color="#04191b" stop-opacity="0"/>
      <stop offset="1" stop-color="#04191b" stop-opacity="0.72"/>
    </radialGradient>

    <filter id="b7" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="b4" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="b2" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#sun)"/>

  <!-- 远山：高峰低谷，重度虚化 -->
  <path filter="url(#b7)" opacity="0.45" fill="#2e8f7d"
        d="M-60,560 C90,510 180,516 268,432 C356,348 404,420 492,398 C580,376 616,262 730,300
           C844,338 872,428 986,404 C1100,380 1150,268 1272,312 C1394,356 1436,448 1550,414
           C1664,380 1740,286 1852,330 C1920,358 1960,380 1980,372 L1980,1140 L-60,1140 Z"/>

  <!-- 中景山脊 -->
  <path filter="url(#b4)" opacity="0.72" fill="#12564f"
        d="M-60,708 C110,660 214,716 338,650 C462,584 536,668 682,628 C828,588 902,486 1062,534
           C1222,582 1272,676 1420,642 C1568,608 1650,520 1796,566 C1884,594 1938,616 1980,604
           L1980,1140 L-60,1140 Z"/>

  <!-- 山间雾气（柔和不规则） -->
  <ellipse cx="980" cy="720" rx="1020" ry="180" fill="url(#fog)"/>
  <ellipse cx="430" cy="640" rx="520" ry="120" fill="url(#fog)" opacity="0.7"/>

  <!-- 近景剪影 -->
  <path filter="url(#b2)" opacity="0.95" fill="#0a3538"
        d="M-60,884 C110,846 232,900 384,868 C536,836 616,768 774,806 C932,844 1002,922 1160,894
           C1318,866 1400,796 1556,832 C1712,868 1836,928 1980,900 L1980,1140 L-60,1140 Z"/>

  <!-- 压暗四周 -->
  <rect width="1920" height="1080" fill="url(#vig)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.05"/>
</svg>
